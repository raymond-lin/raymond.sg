name: Update CNET stats

on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 09:17 Singapore time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-cnet.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/cnet.json; then
            echo "No change to CNET stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cnet.json
          git commit -m "chore: update CNET stats"
          git push
